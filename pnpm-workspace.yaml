# ReelEel monorepo — every shippable app and shared library lives here.
#   apps/*     user-facing applications (cli, desktop, pwa)
#   packages/* shared libraries consumed by the apps (core, ui, sports)
#   tools/*    build/release/dev tooling
packages:
  - apps/*
  - packages/*
  - tools/*
  # apps/mobile is deliberately excluded: React Native pulls a large,
  # platform-specific dependency tree that the server image must never install,
  # and the Dockerfile copies workspace manifests explicitly. It keeps its own
  # lockfile and consumes @reeleel/client through a file: dependency.
  - '!apps/mobile'

allowBuilds:
  esbuild: true
  # Its postinstall fetches the native onnxruntime binaries; without it the
  # detector cannot load a model.
  onnxruntime-node: true
